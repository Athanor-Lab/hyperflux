# AnimeWorld extractor for Hyperflux.
#
# Drop this file in one of the extractor config directories so `flux <page-url>`
# resolves the real media URL automatically:
#
#   ~/.config/hyperflux/extractors/        (or $XDG_CONFIG_HOME/hyperflux/...)
#   /usr/local/share/hyperflux/extractors/
#   /usr/share/hyperflux/extractors/
#
# Then just run:   flux 'https://www.animeworld.ac/play/anime-name.xxxx/AbC123'
#
# SECURITY NOTE: an extractor config issues arbitrary HTTP requests with the
# headers it declares. Treat shared configs like scripts and review them before
# use. Hyperflux never fetches configs from a URL and never forwards your
# cookies unless a `header` line adds them explicitly.

# Extractor identifier (also the default generated filename).
name   animeworld

# Activate this config when the input URL looks like an AnimeWorld play page.
# Multiple `match` lines are OR-ed. POSIX Extended Regular Expression.
match  animeworld\.[a-z]+/play/

# The episode id is the last path segment of the page URL.
# `var <name> <- <source> regex <ERE>` captures group 1 of the ERE.
var    epid   <- url     regex /play/[^/]+/([A-Za-z0-9]+)

# The landing HTML does NOT contain the media URL; the player loads it from an
# internal API. `get` performs an HTTP GET and names the response body so later
# directives can extract from it. Indented `header K=V` lines are sent with the
# request. {epid} and {url} are interpolated from earlier captures / builtins.
get    player <- https://www.animeworld.ac/api/episode/serverPlayerAnimeWorld?id={epid}
       header Referer={url}
       header X-Requested-With=XMLHttpRequest

# The API fragment contains <source src="...mp4">. Capture the URL.
var    media  <- player  regex <source[^>]+src="([^"]+)"

# The resolved media URL. A relative value is resolved against the page URL.
# .mp4 -> direct accelerated download (Hyperflux F1).
# .m3u8 -> HLS module (a later phase).
output {media}
