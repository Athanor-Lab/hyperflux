name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel superseded runs on the same ref so only the latest commit's CI runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the checked-out source.
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang autoconf automake libtool \
            autoconf-archive autopoint gettext pkg-config libssl-dev txt2man \
            ffmpeg python3-cryptography

      - name: Bootstrap (autoreconf)
        run: |
          set -euo pipefail
          autoreconf -fi

      - name: Configure
        run: |
          set -euo pipefail
          # --disable-Werror: some pre-existing warnings are otherwise fatal.
          ./configure --disable-Werror CC="${CC}"

      - name: Build
        run: |
          set -euo pipefail
          make -j"$(nproc)"

      - name: Unit test (url_glob, 35 checks)
        run: |
          set -euo pipefail
          # Pure module, no autotools needed; built with the matrix compiler.
          "${CC}" -D_DEFAULT_SOURCE -Wall -Wextra -g \
            src/url_glob.c src/test_url_glob.c -o /tmp/test_url_glob
          out="$(/tmp/test_url_glob)"
          echo "${out}"
          echo "${out}" | grep -q '^OK: all'

      - name: Unit test (extractor)
        run: |
          set -euo pipefail
          # Pure module, no autotools needed; built with the matrix compiler.
          "${CC}" -D_DEFAULT_SOURCE -Wall -Wextra -g \
            src/extractor.c src/test_extractor.c -o /tmp/test_extractor
          out="$(/tmp/test_extractor)"
          echo "${out}"
          echo "${out}" | grep -q '^OK: all'

      - name: Unit test (tui window/row math)
        run: |
          set -euo pipefail
          # Pure window/row-count helpers (the breakage-prone math). The
          # interactive prompt is not unit-tested; these are. No autotools.
          "${CC}" -D_DEFAULT_SOURCE -Wall -Wextra -g \
            src/tui.c src/test_tui.c -o /tmp/test_tui
          out="$(/tmp/test_tui)"
          echo "${out}"
          echo "${out}" | grep -q '^OK: all'

      - name: Unit test (hls)
        run: |
          set -euo pipefail
          # Pure half of hls.c (parse/select/AES) + extractor for URL resolve.
          # Links OpenSSL libcrypto for EVP; no autotools, no HLS_HAVE_FLUX.
          "${CC}" -D_DEFAULT_SOURCE -Wall -Wextra -g \
            src/hls.c src/extractor.c src/test_hls.c -lcrypto -o /tmp/test_hls
          out="$(/tmp/test_hls)"
          echo "${out}"
          echo "${out}" | grep -q '^OK: all'

      - name: Unit test (scan)
        run: |
          set -euo pipefail
          # Page scanner over saved HTML fixtures (no network). SCAN_HAVE_HLS
          # pulls in the pure half of hls.c for HLS candidate durations.
          "${CC}" -D_DEFAULT_SOURCE -DSCAN_HAVE_HLS -Wall -Wextra -g \
            src/scan.c src/extractor.c src/hls.c src/test_scan.c -lcrypto \
            -o /tmp/test_scan
          out="$(/tmp/test_scan)"
          echo "${out}"
          echo "${out}" | grep -q '^OK: all'

      - name: Smoke test (localhost glob download)
        run: |
          set -euo pipefail

          # Absolute path: the binary is run from inside temp dirs below.
          flux="${GITHUB_WORKSPACE}/flux"
          test -x "${flux}"

          # Serve a temp dir over loopback only; assert the globbed download
          # fetched all three files byte-for-byte. No external network.
          srvdir="$(mktemp -d)"
          workdir="$(mktemp -d)"
          server_pid=""

          cleanup() {
            if [ -n "${server_pid}" ] && kill -0 "${server_pid}" 2>/dev/null; then
              kill "${server_pid}" 2>/dev/null || true
              wait "${server_pid}" 2>/dev/null || true
            fi
            rm -rf "${srvdir}" "${workdir}"
          }
          trap cleanup EXIT

          # Distinct, non-trivial payloads so a wrong/empty file is caught.
          head -c 4096  /dev/urandom > "${srvdir}/v01.bin"
          head -c 8192  /dev/urandom > "${srvdir}/v02.bin"
          head -c 16384 /dev/urandom > "${srvdir}/v03.bin"

          # Pick an ephemeral port the kernel just confirmed is free.
          port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"

          python3 -m http.server "${port}" \
            --bind 127.0.0.1 --directory "${srvdir}" >/dev/null 2>&1 &
          server_pid=$!

          # Wait for the server to accept connections (bounded).
          for _ in $(seq 1 50); do
            if python3 -c "import socket,sys; s=socket.socket(); s.settimeout(0.2); sys.exit(0 if s.connect_ex(('127.0.0.1', ${port}))==0 else 1)"; then
              break
            fi
            sleep 0.2
          done

          assert_match() {
            # $1 = served file, $2 = downloaded file
            test -f "$2" || { echo "missing download: $2" >&2; exit 1; }
            cmp -s "$1" "$2" || { echo "byte mismatch: $2" >&2; exit 1; }
          }

          # --- separate-downloads mode: glob expands to one file each,
          #     written to the current working directory ---
          sep="${workdir}/separate"
          mkdir -p "${sep}"
          ( cd "${sep}" && "${flux}" -q "http://127.0.0.1:${port}/v[01-03].bin" )
          assert_match "${srvdir}/v01.bin" "${sep}/v01.bin"
          assert_match "${srvdir}/v02.bin" "${sep}/v02.bin"
          assert_match "${srvdir}/v03.bin" "${sep}/v03.bin"

          # --- mirror mode: -o targets a directory, files land under it ---
          mir="${workdir}/mirror"
          mkdir -p "${mir}"
          "${flux}" -q -o "${mir}/" "http://127.0.0.1:${port}/v[01-03].bin"
          assert_match "${srvdir}/v01.bin" "${mir}/v01.bin"
          assert_match "${srvdir}/v02.bin" "${mir}/v02.bin"
          assert_match "${srvdir}/v03.bin" "${mir}/v03.bin"

          echo "smoke OK: 6 files verified (separate + mirror)"

      - name: HLS e2e (localhost AES-128 download/decrypt/assemble)
        run: |
          set -euo pipefail

          flux="${GITHUB_WORKSPACE}/flux"
          test -x "${flux}"

          srvdir="$(mktemp -d)"
          workdir="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [ -n "${server_pid}" ] && kill -0 "${server_pid}" 2>/dev/null; then
              kill "${server_pid}" 2>/dev/null || true
              wait "${server_pid}" 2>/dev/null || true
            fi
            rm -rf "${srvdir}" "${workdir}"
          }
          trap cleanup EXIT

          # Build a master -> media -> AES-128 segments+key fixture. IV is the
          # big-endian media sequence number (no explicit IV=), exercising the
          # default-IV path. expected.ts is the byte-exact plaintext concat.
          python3 - "${srvdir}" <<'PY'
          import os, sys
          from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes
          srv = sys.argv[1]; key = bytes(range(16)); nseg = 4; seq = 0
          plains = [os.urandom(4096 * (i + 1)) for i in range(nseg)]
          with open(os.path.join(srv, "expected.ts"), "wb") as f:
              for p in plains: f.write(p)
          os.makedirs(os.path.join(srv, "v", "720"), exist_ok=True)
          open(os.path.join(srv, "v", "key.bin"), "wb").write(key)
          def pk(d): n = 16 - len(d) % 16; return d + bytes([n]) * n
          media = ["#EXTM3U", "#EXT-X-VERSION:3", "#EXT-X-TARGETDURATION:6",
                   f"#EXT-X-MEDIA-SEQUENCE:{seq}",
                   '#EXT-X-KEY:METHOD=AES-128,URI="../key.bin"']
          for i, p in enumerate(plains):
              iv = (seq + i).to_bytes(16, "big")
              enc = Cipher(algorithms.AES(key), modes.CBC(iv)).encryptor()
              open(os.path.join(srv, "v", "720", f"seg{i}.ts"), "wb").write(
                  enc.update(pk(p)) + enc.finalize())
              media += ["#EXTINF:6.0,", f"seg{i}.ts"]
          media.append("#EXT-X-ENDLIST")
          open(os.path.join(srv, "v", "720", "index.m3u8"), "w").write(
              "\n".join(media) + "\n")
          master = ["#EXTM3U",
                    "#EXT-X-STREAM-INF:BANDWIDTH=800000,RESOLUTION=640x360",
                    "720/index.m3u8",
                    "#EXT-X-STREAM-INF:BANDWIDTH=2400000,RESOLUTION=1280x720",
                    "720/index.m3u8",
                    "#EXT-X-STREAM-INF:BANDWIDTH=5000000,RESOLUTION=1920x1080",
                    "720/index.m3u8"]
          open(os.path.join(srv, "v", "master.m3u8"), "w").write(
              "\n".join(master) + "\n")
          PY

          port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          python3 -m http.server "${port}" \
            --bind 127.0.0.1 --directory "${srvdir}" >/dev/null 2>&1 &
          server_pid=$!
          for _ in $(seq 1 50); do
            if python3 -c "import socket,sys; s=socket.socket(); s.settimeout(0.2); sys.exit(0 if s.connect_ex(('127.0.0.1', ${port}))==0 else 1)"; then
              break
            fi
            sleep 0.2
          done

          # Force .ts so the output equals the original plaintext byte-for-byte.
          out="${workdir}/got.ts"
          "${flux}" -q --quality 720 --mux ts -o "${out}" \
            "http://127.0.0.1:${port}/v/master.m3u8"
          test -f "${out}" || { echo "no HLS output produced" >&2; exit 1; }
          cmp -s "${srvdir}/expected.ts" "${out}" \
            || { echo "HLS byte mismatch" >&2; exit 1; }

          # mp4 path: a real H.264 TS must remux into a valid mp4 container.
          ffmpeg -nostdin -loglevel error -y -f lavfi \
            -i testsrc=duration=2:size=128x96:rate=10 \
            -c:v libx264 -pix_fmt yuv420p -f mpegts "${srvdir}/full.ts"
          python3 - "${srvdir}" <<'PY'
          import os, sys
          from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes
          srv = sys.argv[1]; key = bytes(range(16))
          data = open(os.path.join(srv, "full.ts"), "rb").read()
          n = len(data) // 188; per = (n // 3) * 188
          parts = [data[0:per], data[per:2 * per], data[2 * per:]]
          os.makedirs(os.path.join(srv, "h"), exist_ok=True)
          open(os.path.join(srv, "h", "key.bin"), "wb").write(key)
          def pk(d): m = 16 - len(d) % 16; return d + bytes([m]) * m
          lines = ["#EXTM3U", "#EXT-X-MEDIA-SEQUENCE:0",
                   '#EXT-X-KEY:METHOD=AES-128,URI="key.bin"']
          for i, p in enumerate(parts):
              iv = i.to_bytes(16, "big")
              enc = Cipher(algorithms.AES(key), modes.CBC(iv)).encryptor()
              open(os.path.join(srv, "h", f"s{i}.ts"), "wb").write(
                  enc.update(pk(p)) + enc.finalize())
              lines += ["#EXTINF:0.7,", f"s{i}.ts"]
          lines.append("#EXT-X-ENDLIST")
          open(os.path.join(srv, "h", "index.m3u8"), "w").write(
              "\n".join(lines) + "\n")
          PY
          "${flux}" -q --mux mp4 -o "${workdir}/out.mp4" \
            "http://127.0.0.1:${port}/h/index.m3u8"
          ffprobe -loglevel error -show_format "${workdir}/out.mp4" >/dev/null \
            || { echo "remuxed mp4 is not a valid container" >&2; exit 1; }

          echo "HLS e2e OK: AES-128 ts byte-exact + mp4 remux valid"

      - name: Scan e2e (localhost --extract-scan --yes config generation)
        run: |
          set -euo pipefail

          flux="${GITHUB_WORKSPACE}/flux"
          test -x "${flux}"

          srvdir="$(mktemp -d)"
          workdir="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [ -n "${server_pid}" ] && kill -0 "${server_pid}" 2>/dev/null; then
              kill "${server_pid}" 2>/dev/null || true
              wait "${server_pid}" 2>/dev/null || true
            fi
            rm -rf "${srvdir}" "${workdir}"
          }
          trap cleanup EXIT

          # A small episode-like page embedding a direct mp4 via <source> and
          # og:video, plus a real payload at that URL so the size probe gets a
          # Content-Length. Plain shell heredoc: no Python indentation traps.
          mkdir -p "${srvdir}/media"
          cat > "${srvdir}/watch.html" <<'HTML'
          <!doctype html><html><head>
          <meta property="og:video" content="/media/episode-7.mp4">
          </head><body>
          <div id="player"><video controls>
          <source src="/media/episode-7.mp4" type="video/mp4">
          </video></div>
          </body></html>
          HTML
          head -c 1048576 /dev/urandom > "${srvdir}/media/episode-7.mp4"

          port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          python3 -m http.server "${port}" \
            --bind 127.0.0.1 --directory "${srvdir}" >/dev/null 2>&1 &
          server_pid=$!
          for _ in $(seq 1 50); do
            if python3 -c "import socket,sys; s=socket.socket(); s.settimeout(0.2); sys.exit(0 if s.connect_ex(('127.0.0.1', ${port}))==0 else 1)"; then
              break
            fi
            sleep 0.2
          done

          # Non-interactive: auto-pick the top candidate, write the config out.
          cfg="${workdir}/gen.conf"
          "${flux}" --extract-scan "http://127.0.0.1:${port}/watch.html" \
            --yes -o "${cfg}"
          echo "=== generated config ==="
          cat "${cfg}"

          # Assert the generated config has the expected directives and that the
          # output line carries the resolved (absolute) media URL.
          want="http://127.0.0.1:${port}/media/episode-7.mp4"
          grep -qE '^name '  "${cfg}" || { echo "missing name" >&2; exit 1; }
          grep -qE '^match ' "${cfg}" || { echo "missing match" >&2; exit 1; }
          grep -qF "output ${want}" "${cfg}" \
            || { echo "output is not the resolved media URL" >&2; exit 1; }

          # '-o -' writes the config to stdout (the legacy default).
          "${flux}" --extract-scan "http://127.0.0.1:${port}/watch.html" --yes \
            -o - | grep -qF "output ${want}" \
            || { echo "stdout config missing output" >&2; exit 1; }

          # Default (no -o): PRINT the config to stdout and STASH it pending,
          # printing a --save-config hint we parse the id out of. A second
          # --save-config step then installs it active.
          udir="${workdir}/cfg"
          export XDG_CONFIG_HOME="${udir}"
          "${flux}" --extract-scan "http://127.0.0.1:${port}/watch.html" --yes \
            > "${workdir}/scan.out" 2> "${workdir}/scan.err"
          grep -qF "output ${want}" "${workdir}/scan.out" \
            || { echo "default scan did not print the resolved output" >&2; \
                 cat "${workdir}/scan.err" >&2; exit 1; }
          grep -q -- "--save-config" "${workdir}/scan.err" \
            || { echo "default scan did not hint --save-config" >&2; \
                 cat "${workdir}/scan.err" >&2; exit 1; }
          id="$(sed -n 's/.*--save-config \([A-Za-z0-9_-]*\).*/\1/p' \
                  "${workdir}/scan.err")"
          test -n "${id}" || { echo "could not parse a pending id" >&2; exit 1; }

          "${flux}" --save-config "${id}" 2> "${workdir}/save.err" \
            || { echo "--save-config failed" >&2; \
                 cat "${workdir}/save.err" >&2; exit 1; }
          saved="${udir}/hyperflux/extractors/site.conf"
          test -f "${saved}" \
            || { echo "--save-config did not install into the user dir" >&2; \
                 cat "${workdir}/save.err" >&2; exit 1; }
          grep -qF "output ${want}" "${saved}" \
            || { echo "saved config missing resolved output" >&2; exit 1; }
          "${flux}" --extract-list | grep -qF "${saved}" \
            || { echo "saved config is not active (not listed)" >&2; exit 1; }
          # A second --save-config of the same id must refuse to clobber.
          if "${flux}" --save-config "${id}" 2>/dev/null; then
            echo "second --save-config clobbered an existing config" >&2; exit 1
          fi

          # --extract-scan-depth=3 is accepted (recursion bound, max 3).
          "${flux}" --extract-scan "http://127.0.0.1:${port}/watch.html" \
            --extract-scan-depth=3 --yes >/dev/null 2>&1 \
            || { echo "--extract-scan-depth=3 not accepted" >&2; exit 1; }

          # --extract-scan-depth=9 above SCAN_MAX_DEPTH must print a clamp notice.
          "${flux}" --extract-scan "http://127.0.0.1:${port}/watch.html" \
            --extract-scan-depth=9 --yes >/dev/null 2>"${workdir}/clamp.err" \
            || true
          grep -qi "clamp" "${workdir}/clamp.err" \
            || { echo "--extract-scan-depth=9 did not print a clamp notice" >&2; \
                 cat "${workdir}/clamp.err" >&2; exit 1; }

          # --extract-scan-depth=abc (non-numeric) must fail with non-zero exit.
          if "${flux}" --extract-scan "http://127.0.0.1:${port}/watch.html" \
               --extract-scan-depth=abc --yes >/dev/null 2>/dev/null; then
            echo "--extract-scan-depth=abc should have failed" >&2; exit 1
          fi

          # Path traversal guard: a crafted pending file with name=../../../escape
          # must not install outside the extractors dir.
          penddir="${udir}/hyperflux/extractors/.pending"
          mkdir -p "${penddir}"
          evil_id="evil-00000"
          printf 'name ../../../../tmp/flux_escape_%s\nmatch evil\\.example\\.com\noutput {url}\n' \
            "$$" > "${penddir}/${evil_id}.conf"
          "${flux}" --save-config "${evil_id}" 2>/dev/null || true
          if ls /tmp/flux_escape_* 2>/dev/null | grep -q .; then
            echo "BUG: path traversal escaped extractors dir" >&2; exit 1
          fi
          # Any saved file must remain under the extractors dir.
          if find "${udir}/hyperflux/extractors" -name "flux_escape_*" | grep -q .; then
            echo "BUG: traversal file landed inside extractors dir with bad name" >&2; exit 1
          fi

          unset XDG_CONFIG_HOME

          echo "Scan e2e OK: --extract-scan prints+stashes, --save-config installs, refuses clobber"

      - name: Install e2e (bundled extractor config ships active)
        run: |
          set -euo pipefail
          # Item 1: 'make install' lands the example config in a discovery dir.
          rm -rf stage
          make install DESTDIR="$(pwd)/stage" prefix=/usr >/dev/null
          test -f stage/usr/share/hyperflux/extractors/animeworld.conf \
            || { echo "bundled config not installed to discovery dir" >&2; exit 1; }
          # A user with no config of their own discovers the shipped one when it
          # sits in a discovery dir (proven here via the user dir, the first one
          # scanned; system dirs need root and are validated by the install path).
          flux="${GITHUB_WORKSPACE}/flux"
          udir="$(mktemp -d)"
          mkdir -p "${udir}/hyperflux/extractors"
          cp stage/usr/share/hyperflux/extractors/animeworld.conf \
            "${udir}/hyperflux/extractors/"
          XDG_CONFIG_HOME="${udir}" HOME="$(mktemp -d)" \
            "${flux}" --extract-list | grep -q animeworld \
            || { echo "shipped config not discovered" >&2; exit 1; }
          rm -rf "${udir}"
          echo "Install e2e OK: bundled config installs and is discoverable"

      - name: Series e2e (localhost --episodes / --all batch download)
        run: |
          set -euo pipefail

          flux="${GITHUB_WORKSPACE}/flux"
          test -x "${flux}"

          srvdir="$(mktemp -d)"
          workdir="$(mktemp -d)"
          cfgdir="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [ -n "${server_pid}" ] && kill -0 "${server_pid}" 2>/dev/null; then
              kill "${server_pid}" 2>/dev/null || true
              wait "${server_pid}" 2>/dev/null || true
            fi
            rm -rf "${srvdir}" "${workdir}" "${cfgdir}"
          }
          trap cleanup EXIT

          # A series page listing a LARGE number of episode pages (N=60) to
          # prove there is NO cap and the last episode stays reachable. Each
          # episode page embeds a <source> pointing at a distinct media file.
          # The config 'list's the episode hrefs; the per-episode pipeline
          # resolves each <source>.
          N=60
          mkdir -p "${srvdir}/play"
          {
            echo '<!doctype html><html><body>'
            for i in $(seq 1 "${N}"); do
              ii="$(printf '%02d' "${i}")"
              head -c $((1024 + i)) /dev/urandom > "${srvdir}/ep${i}.bin"
              cat > "${srvdir}/play/Ep${ii}.html" <<HTML
          <!doctype html><html><body>
          <video><source src="/ep${i}.bin" type="video/mp4"></video>
          </body></html>
          HTML
              echo "<a data-num=\"${i}\" href=\"/play/Ep${ii}.html\">${i}</a>"
            done
            echo '</body></html>'
          } > "${srvdir}/series.html"

          port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          python3 -m http.server "${port}" \
            --bind 127.0.0.1 --directory "${srvdir}" >/dev/null 2>&1 &
          server_pid=$!
          for _ in $(seq 1 50); do
            if python3 -c "import socket,sys; s=socket.socket(); s.settimeout(0.2); sys.exit(0 if s.connect_ex(('127.0.0.1', ${port}))==0 else 1)"; then
              break
            fi
            sleep 0.2
          done

          export XDG_CONFIG_HOME="${cfgdir}"
          mkdir -p "${XDG_CONFIG_HOME}/hyperflux/extractors"
          cat > "${XDG_CONFIG_HOME}/hyperflux/extractors/series.conf" <<'CONF'
          name   localseries
          match  /series\.html
          get    page     <- {url}
          list   episodes <- page  regex href="(/play/Ep[0-9]+\.html)"
          get    epage    <- {url}
          var    media    <- epage regex <source[^>]+src="([^"]+)"
          output {media}
          CONF

          assert_match() {
            test -f "$2" || { echo "missing download: $2" >&2; exit 1; }
            cmp -s "$1" "$2" || { echo "byte mismatch: $2" >&2; exit 1; }
          }

          # --episodes over a LARGE list: a spread including the LAST episode
          # (60) proves no truncation. Exactly {1,3,60} land; 2 is absent.
          out="${workdir}/sel"
          mkdir -p "${out}"
          "${flux}" -q --episodes 1,3,60 -o "${out}/" \
            "http://127.0.0.1:${port}/series.html"
          assert_match "${srvdir}/ep1.bin"  "${out}/ep1.bin"
          assert_match "${srvdir}/ep3.bin"  "${out}/ep3.bin"
          assert_match "${srvdir}/ep60.bin" "${out}/ep60.bin"
          test ! -e "${out}/ep2.bin" \
            || { echo "episode 2 should not have been downloaded" >&2; exit 1; }

          # Re-run with ep1 already present: it must be SKIPPED, the newly
          # requested ep2 downloaded. Proves on-disk status + skip-if-present.
          "${flux}" --episodes 1,2 -o "${out}/" \
            "http://127.0.0.1:${port}/series.html" > "${workdir}/rerun.log" 2>&1
          grep -q "already on disk, skipping" "${workdir}/rerun.log" \
            || { echo "re-run did not skip the on-disk episode" >&2;
                 cat "${workdir}/rerun.log" >&2; exit 1; }
          assert_match "${srvdir}/ep2.bin" "${out}/ep2.bin"

          # --all : every one of the N episodes, byte-exact; count matches N.
          alldir="${workdir}/all"
          mkdir -p "${alldir}"
          "${flux}" -q --all -o "${alldir}/" \
            "http://127.0.0.1:${port}/series.html"
          assert_match "${srvdir}/ep1.bin"  "${alldir}/ep1.bin"
          assert_match "${srvdir}/ep30.bin" "${alldir}/ep30.bin"
          assert_match "${srvdir}/ep60.bin" "${alldir}/ep60.bin"
          got="$(ls "${alldir}" | wc -l)"
          test "${got}" -eq "${N}" \
            || { echo "expected ${N} files, got ${got}" >&2; exit 1; }

          # --all RE-RUN: everything is present, so 0 downloaded, N skipped.
          "${flux}" --all -o "${alldir}/" \
            "http://127.0.0.1:${port}/series.html" > "${workdir}/all2.log" 2>&1
          grep -qE "0 downloaded, ${N} skipped" "${workdir}/all2.log" \
            || { echo "re-run --all should skip everything" >&2;
                 tail -3 "${workdir}/all2.log" >&2; exit 1; }

          # A bad --episodes spec (out of range over N) must exit non-zero.
          if "${flux}" -q --episodes 99 -o "${out}/" \
              "http://127.0.0.1:${port}/series.html" 2>/dev/null; then
            echo "bad --episodes spec was accepted" >&2; exit 1
          fi

          echo "Series e2e OK: N=${N} no cap, --episodes/--all byte-exact, on-disk skip + re-run, bad spec rejected"

  sanitizers:
    name: sanitizers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: ASan/UBSan unit test (url_glob)
        run: |
          set -euo pipefail
          # Pure module: no autotools needed, fast under sanitizers.
          clang -D_DEFAULT_SOURCE -Wall -Wextra -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            src/url_glob.c src/test_url_glob.c -o /tmp/test_url_glob_san
          export ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          out="$(/tmp/test_url_glob_san)"
          echo "${out}"
          echo "${out}" | grep -q '^OK: all'

      - name: ASan/UBSan unit test (extractor)
        run: |
          set -euo pipefail
          # Pure module: no autotools needed, fast under sanitizers.
          clang -D_DEFAULT_SOURCE -Wall -Wextra -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            src/extractor.c src/test_extractor.c -o /tmp/test_extractor_san
          export ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          out="$(/tmp/test_extractor_san)"
          echo "${out}"
          echo "${out}" | grep -q '^OK: all'

      - name: ASan/UBSan unit test (tui window/row math)
        run: |
          set -euo pipefail
          # Pure window/row-count helpers under sanitizers.
          clang -D_DEFAULT_SOURCE -Wall -Wextra -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            src/tui.c src/test_tui.c -o /tmp/test_tui_san
          export ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          out="$(/tmp/test_tui_san)"
          echo "${out}"
          echo "${out}" | grep -q '^OK: all'

      - name: ASan/UBSan unit test (hls)
        run: |
          set -euo pipefail
          # Pure half of hls.c + extractor; links libcrypto for OpenSSL EVP.
          clang -D_DEFAULT_SOURCE -Wall -Wextra -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            src/hls.c src/extractor.c src/test_hls.c -lcrypto \
            -o /tmp/test_hls_san
          export ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          out="$(/tmp/test_hls_san)"
          echo "${out}"
          echo "${out}" | grep -q '^OK: all'

      - name: ASan/UBSan unit test (scan)
        run: |
          set -euo pipefail
          # Page scanner over HTML fixtures + hls (durations) + extractor.
          clang -D_DEFAULT_SOURCE -DSCAN_HAVE_HLS -Wall -Wextra -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            src/scan.c src/extractor.c src/hls.c src/test_scan.c -lcrypto \
            -o /tmp/test_scan_san
          export ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          out="$(/tmp/test_scan_san)"
          echo "${out}"
          echo "${out}" | grep -q '^OK: all'
